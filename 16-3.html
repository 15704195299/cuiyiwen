<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <!-- 姓名：崔溢文，日期：2026-10-29，功能名称：携程旅行 App 垂直导航栏复刻 -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>16-3 携程旅行垂直导航</title>
    <link rel="stylesheet" href="./font/iconfont.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            background: #f4f6f9;
            color: #22304a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 40px 16px;
        }
        .cyw-page {
            width: 100%;
            max-width: 280px;
            background: #ffffff;
            border-radius: 14px;
            box-shadow: 0 4px 18px rgba(0,0,0,0.07);
            overflow: hidden;
        }
        .cyw-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 16px 20px;
            border-bottom: 1px solid #f0f0f0;
            cursor: pointer;
            transition: background 0.15s ease;
        }
        .cyw-item:last-child {
            border-bottom: none;
        }
        .cyw-item:active {
            background: #f5f8fb;
        }
        .cyw-icon {
            font-size: 22px;
            color: #333;
            flex-shrink: 0;
        }
        .cyw-label {
            font-size: 15px;
            color: #1a1a1a;
            letter-spacing: 0.5px;
        }
        .cyw-home {
            margin-top: 28px;
            text-align: center;
        }
        .cyw-home a {
            display: inline-block;
            padding: 8px 24px;
            background: #1fa0e0;
            color: #fff;
            text-decoration: none;
            border-radius: 20px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="cyw-page">
        <div class="cyw-item">
            <i class="iconfont icon-shouye cyw-icon"></i>
            <span class="cyw-label">酒店</span>
        </div>
        <div class="cyw-item">
            <i class="iconfont icon-dingwei cyw-icon"></i>
            <span class="cyw-label">机票</span>
        </div>
        <div class="cyw-item">
            <i class="iconfont icon-sousuo cyw-icon"></i>
            <span class="cyw-label">火车票</span>
        </div>
        <div class="cyw-item">
            <i class="iconfont icon-faxian cyw-icon"></i>
            <span class="cyw-label">旅游</span>
        </div>
        <div class="cyw-item">
            <i class="iconfont icon-shoucang cyw-icon"></i>
            <span class="cyw-label">门票 · 活动</span>
        </div>
        <div class="cyw-item">
            <i class="iconfont icon-gouwuchekong cyw-icon"></i>
            <span class="cyw-label">汽车 · 船票</span>
        </div>
        <div class="cyw-item">
            <i class="iconfont icon-gouwuche cyw-icon"></i>
            <span class="cyw-label">用车</span>
        </div>
    </div>

    <div class="cyw-home">
        <a href="./1-1.html">首页</a>
    </div>
</body>
</html>
