<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <!-- 姓名：崔溢文，日期：2026-11-05，功能名称：Canvas 粒子文字动画 -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>18-1 Canvas 粒子文字动画</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; }
        body {
            font-family: "Microsoft YaHei", sans-serif;
            background: #0d1117;
            color: #fff;
            overflow: hidden;
        }
        .cyw-head {
            text-align: center;
            padding-top: 14px;
            z-index: 10;
            position: relative;
            pointer-events: none;
        }
        .cyw-head h1 {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 4px;
            color: #f0f0f0;
        }
        .cyw-head p {
            font-size: 12px;
            color: #888;
            margin-top: 4px;
            letter-spacing: 1px;
        }
        .cyw-wrap {
            position: fixed;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: crosshair;
        }
        .cyw-controls {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 10;
        }
        .cyw-btn {
            padding: 9px 22px;
            font-size: 13px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            color: #ddd;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }
        .cyw-btn:hover { background: rgba(255,255,255,0.15); }
        .cyw-btn.cyw-active {
            background: rgba(0,255,150,0.15);
            border-color: #00ff96;
            color: #00ff96;
        }
        .cyw-home {
            position: fixed;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
        }
        .cyw-home a {
            color: #666;
            text-decoration: none;
            font-size: 12px;
            letter-spacing: 1px;
        }
        .cyw-home a:hover { color: #00ff96; }
    </style>
</head>
<body>
    <div class="cyw-head">
        <h1>崔 溢 文</h1>
        <p>姓名：崔溢文 · 18-1 · Canvas 粒子文字动画</p>
    </div>

    <div class="cyw-wrap">
        <canvas id="cyw_canvas"></canvas>
    </div>

    <div class="cyw-controls">
        <button class="cyw-btn" id="cyw_btAttract">吸引模式</button>
        <button class="cyw-btn cyw-active" id="cyw_btRepel">排斥模式</button>
        <button class="cyw-btn" id="cyw_btFollow">鼠标跟随</button>
        <button class="cyw-btn" id="cyw_btExplode">爆炸重组</button>
    </div>

    <div class="cyw-home"><a href="./1-1.html">← 首页</a></div>

    <script>
        (function () {
            var cywCanvas = document.getElementById("cyw_canvas");
            var cywCtx = cywCanvas.getContext("2d");

            var cywW = 0, cywH = 0;
            var cywParticles = [];
            var cywMouse = { x: -9999, y: -9999, active: false };
            var cywMode = "repel";
            var cywExploding = false;

            function cyw_resize() {
                cywW = cywCanvas.width = window.innerWidth;
                cywH = cywCanvas.height = window.innerHeight;
                cyw_buildText();
            }

            function cyw_buildText() {
                var cywOff = document.createElement("canvas");
                var cywOffCtx = cywOff.getContext("2d");
                var cywFontSize = Math.min(cywW / 5, cywH * 0.35);
                cywOff.width = cywW;
                cywOff.height = cywH;

                cywOffCtx.fillStyle = "#000";
                cywOffCtx.fillRect(0, 0, cywW, cywH);
                cywOffCtx.fillStyle = "#fff";
                cywOffCtx.font = "bold " + cywFontSize + "px 'Microsoft YaHei', sans-serif";
                cywOffCtx.textAlign = "center";
                cywOffCtx.textBaseline = "middle";
                cywOffCtx.fillText("崔溢文", cywW / 2, cywH / 2);

                var cywImg = cywOffCtx.getImageData(0, 0, cywW, cywH).data;
                var cywStep = Math.max(3, Math.floor(cywFontSize / 60));
                var cywNewParts = [];

                for (var y = 0; y < cywH; y += cywStep) {
                    for (var x = 0; x < cywW; x += cywStep) {
                        var cywIdx = (y * cywW + x) * 4;
                        if (cywImg[cywIdx] > 128) {
                            var cywHue = 140 + Math.random() * 50;
                            cywNewParts.push({
                                tx: x,
                                ty: y,
                                x: Math.random() * cywW,
                                y: Math.random() * cywH,
                                vx: 0,
                                vy: 0,
                                size: cywStep,
                                hue: cywHue,
                                sat: 80 + Math.random() * 20,
                                light: 55 + Math.random() * 25
                            });
                        }
                    }
                }

                if (cywParticles.length === 0) {
                    cywParticles = cywNewParts;
                } else {
                    var cywOldMap = {};
                    cywParticles.forEach(function (p) {
                        var cywKey = Math.round(p.tx) + "," + Math.round(p.ty);
                        cywOldMap[cywKey] = p;
                    });
                    cywParticles = cywNewParts.map(function (np) {
                        var cywK = Math.round(np.tx) + "," + Math.round(np.ty);
                        if (cywOldMap[cywK]) {
                            np.x = cywOldMap[cywK].x;
                            np.y = cywOldMap[cywK].y;
                            np.vx = cywOldMap[cywK].vx;
                            np.vy = cywOldMap[cywK].vy;
                        }
                        return np;
                    });
                }
            }

            function cyw_forceToTarget(p) {
                var cywAx = (p.tx - p.x) * 0.02;
                var cywAy = (p.ty - p.y) * 0.02;
                p.vx += cywAx;
                p.vy += cywAy;
            }

            function cyw_applyMouse(p) {
                if (!cywMouse.active) return;
                var cywDx = p.x - cywMouse.x;
                var cywDy = p.y - cywMouse.y;
                var cywDist = Math.sqrt(cywDx * cywDx + cywDy * cywDy);
                var cywRadius = 120;
                if (cywDist > cywRadius) return;

                var cywForce = (cywRadius - cywDist) / cywRadius;
                cywForce = cywForce * cywForce;

                if (cywMode === "repel") {
                    p.vx += cywDx / cywDist * cywForce * 3;
                    p.vy += cywDy / cywDist * cywForce * 3;
                } else if (cywMode === "attract") {
                    p.vx -= cywDx / cywDist * cywForce * 2;
                    p.vy -= cywDy / cywDist * cywForce * 2;
                } else if (cywMode === "follow") {
                    p.vx -= cywDx / cywDist * cywForce * 4;
                    p.vy -= cywDy / cywDist * cywForce * 4;
                }
            }

            function cyw_update() {
                cywParticles.forEach(function (p) {
                    if (cywMode !== "follow") {
                        cyw_forceToTarget(p);
                    } else {
                        p.vx *= 0.9;
                        p.vy *= 0.9;
                    }

                    cyw_applyMouse(p);

                    p.vx *= 0.86;
                    p.vy *= 0.86;
                    p.x += p.vx;
                    p.y += p.vy;
                });
            }

            function cyw_draw() {
                cywCtx.fillStyle = "rgba(13, 17, 23, 0.25)";
                cywCtx.fillRect(0, 0, cywW, cywH);

                cywParticles.forEach(function (p) {
                    var cywColor = "hsl(" + p.hue + "," + p.sat + "%," + p.light + "%)";
                    cywCtx.fillStyle = cywColor;
                    cywCtx.fillRect(p.x, p.y, p.size - 1, p.size - 1);
                });

                cyw_update();
                requestAnimationFrame(cyw_draw);
            }

            function cyw_explode() {
                cywParticles.forEach(function (p) {
                    var cywAng = Math.random() * Math.PI * 2;
                    var cywSpeed = 2 + Math.random() * 5;
                    p.vx = Math.cos(cywAng) * cywSpeed;
                    p.vy = Math.sin(cywAng) * cywSpeed;
                });
                cywExploding = true;
                setTimeout(function () { cywExploding = false; }, 1500);
            }

            document.getElementById("cyw_btRepel").addEventListener("click", function () {
                cywMode = "repel";
                cyw_setActive("cyw_btRepel");
            });
            document.getElementById("cyw_btAttract").addEventListener("click", function () {
                cywMode = "attract";
                cyw_setActive("cyw_btAttract");
            });
            document.getElementById("cyw_btFollow").addEventListener("click", function () {
                cywMode = "follow";
                cyw_setActive("cyw_btFollow");
            });
            document.getElementById("cyw_btExplode").addEventListener("click", function () {
                cyw_explode();
                cywMode = "repel";
                cyw_setActive("cyw_btRepel");
            });

            function cyw_setActive(id) {
                document.querySelectorAll(".cyw-btn").forEach(function (b) { b.classList.remove("cyw-active"); });
                document.getElementById(id).classList.add("cyw-active");
            }

            window.addEventListener("mousemove", function (e) {
                cywMouse.x = e.clientX;
                cywMouse.y = e.clientY;
                cywMouse.active = true;
            });
            window.addEventListener("mouseleave", function () {
                cywMouse.active = false;
                cywMouse.x = -9999;
                cywMouse.y = -9999;
            });
            window.addEventListener("resize", cyw_resize);

            cyw_resize();
            cyw_draw();
        })();
    </script>
</body>
</html>
