<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <!-- 姓名：崔溢文，日期：2026-11-05，功能名称：Canvas 文字下落动画 -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>18-1 Canvas 文字下落</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            background: #0a0a1a;
            color: #22304a;
            min-height: 100vh;
            padding: 20px 16px;
        }
        .cyw-wrap { max-width: 1000px; margin: 0 auto; }
        .cyw-title {
            font-size: 18px;
            font-weight: 600;
            color: #1fa0e0;
            margin-bottom: 12px;
            text-align: center;
        }
        .cyw-panel {
            background: #14142a;
            border-radius: 8px;
            padding: 14px 18px;
            margin-bottom: 14px;
            border: 1px solid #2a2a4a;
        }
        .cyw-panel h2 {
            font-size: 14px;
            color: #5ecdf3;
            margin-bottom: 8px;
        }
        .cyw-panel p {
            font-size: 12px;
            color: #aaa;
            line-height: 1.8;
        }
        .cyw-panel code {
            background: #2a2a4a;
            color: #a6e22e;
            padding: 1px 6px;
            border-radius: 3px;
            font-size: 11px;
            font-family: Consolas, "Courier New", monospace;
        }
        .cyw-canvas-box {
            background: #0a0a1a;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,255,100,0.1);
            margin-bottom: 14px;
        }
        canvas {
            display: block;
            width: 100%;
            height: 380px;
        }
        .cyw-controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            padding: 12px 18px;
            background: #14142a;
            border-radius: 8px;
            border: 1px solid #2a2a4a;
            margin-bottom: 14px;
        }
        .cyw-btn {
            padding: 7px 18px;
            background: #1fa0e0;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.15s;
        }
        .cyw-btn:hover { background: #1890cc; }
        .cyw-btn.cyw-pause { background: #fa8c16; }
        .cyw-btn.cyw-pause:hover { background: #d46b08; }
        .cyw-btn.cyw-reset { background: #999; }
        .cyw-btn.cyw-reset:hover { background: #777; }
        .cyw-label {
            font-size: 12px;
            color: #888;
            align-self: center;
        }
        .cyw-home { text-align: center; margin-top: 14px; }
        .cyw-home a {
            display: inline-block;
            padding: 8px 24px;
            background: #1fa0e0;
            color: #fff;
            text-decoration: none;
            border-radius: 20px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="cyw-wrap">
        <div class="cyw-title">Canvas 文字下落动画 —— 黑客帝国风</div>

        <div class="cyw-panel">
            <h2>🎨 技术要点</h2>
            <p>
                使用 <code>canvas.getContext("2d")</code> 获取 2D 绘图上下文，<br>
                每列有一个 <code>y</code> 坐标，循环 <code>requestAnimationFrame</code> 让它不断增加实现下落，<br>
                底部留一段渐隐（半透明黑色矩形覆盖）制造拖尾效果，顶部新字符是亮绿色，其余暗绿色。
            </p>
        </div>

        <div class="cyw-canvas-box">
            <canvas id="cyw_canvas"></canvas>
        </div>

        <div class="cyw-controls">
            <button id="cyw_pauseBtn" class="cyw-btn cyw-pause">⏸ 暂停</button>
            <button id="cyw_resetBtn" class="cyw-btn cyw-reset">🔄 重置</button>
            <span class="cyw-label">速度：</span>
            <select id="cyw_speed" class="cyw-btn" style="padding:7px 12px">
                <option value="0.5">慢</option>
                <option value="1" selected>正常</option>
                <option value="2">快</option>
                <option value="4">极快</option>
            </select>
            <span class="cyw-label">颜色：</span>
            <select id="cyw_color" class="cyw-btn" style="padding:7px 12px">
                <option value="#00ff66" selected>经典绿</option>
                <option value="#1fa0e0">科技蓝</option>
                <option value="#ff4d4f">警报红</option>
                <option value="#ffd700">黄金</option>
                <option value="#ffffff">纯白</option>
            </select>
        </div>

        <div class="cyw-home"><a href="./1-1.html">首页</a></div>
    </div>

    <script>
        (function () {
            var cywCanvas = document.getElementById("cyw_canvas");
            var cywCtx = cywCanvas.getContext("2d");
            var cywSpeedSel = document.getElementById("cyw_speed");
            var cywColorSel = document.getElementById("cyw_color");
            var cywPauseBtn = document.getElementById("cyw_pauseBtn");
            var cywResetBtn = document.getElementById("cyw_resetBtn");

            var cywLines = [
                "崔 溢 文",
                "高级网页设计",
                "课堂实践作业",
                "Canvas 文字下落",
                "JavaScript 动画",
                "requestAnimationFrame",
                "2026 秋",
                "加油！冲冲冲 🔥"
            ];

            var cywStreams = [];
            var cywStreamH = 0;

            function cyw_initStreams() {
                cywStreams = [];
                var cywCols = Math.ceil(cywCanvas.width / cywFontSize);
                for (var i = 0; i < cywCols; i++) {
                    var cywText = cywLines[Math.floor(Math.random() * cywLines.length)];
                    var cywChars = cywText.split("");
                    cywStreams.push({
                        x: i * cywFontSize,
                        y: -Math.random() * cywStreamH,
                        text: cywText,
                        chars: cywChars,
                        offset: Math.floor(Math.random() * cywChars.length),
                        speed: cywSpeed * (0.7 + Math.random() * 0.8)
                    });
                }
            }

            function cyw_resize() {
                var cywRect = cywCanvas.parentElement.getBoundingClientRect();
                cywCanvas.width = cywRect.width;
                cywCanvas.height = 420;
                cywStreamH = cywCanvas.height + 200;
                cywCtx.fillStyle = "#0a0a1a";
                cywCtx.fillRect(0, 0, cywCanvas.width, cywCanvas.height);
                cyw_initStreams();
            }

            function cyw_draw() {
                if (!cywRunning) {
                    cywAnimId = requestAnimationFrame(cyw_draw);
                    return;
                }

                cywCtx.fillStyle = "rgba(10, 10, 26, 0.1)";
                cywCtx.fillRect(0, 0, cywCanvas.width, cywCanvas.height);

                cywCtx.font = cywFontSize + "px 'Microsoft YaHei', Consolas, monospace";
                cywCtx.textBaseline = "top";

                cywStreams.forEach(function (s) {
                    for (var j = 0; j < s.chars.length; j++) {
                        var cywIdx = (s.offset + j) % s.chars.length;
                        var cywChar = s.chars[cywIdx];
                        var cywY = s.y + j * cywFontSize;

                        if (cywY < -cywFontSize || cywY > cywCanvas.height) continue;

                        if (j === s.chars.length - 1) {
                            cywCtx.fillStyle = "#ffffff";
                            cywCtx.shadowColor = cywColor;
                            cywCtx.shadowBlur = 8;
                        } else if (j === s.chars.length - 2) {
                            cywCtx.fillStyle = cywColor;
                            cywCtx.shadowBlur = 0;
                        } else {
                            var cywAlpha = 1 - j / s.chars.length;
                            cywCtx.fillStyle = cywColor;
                            cywCtx.globalAlpha = cywAlpha * 0.7;
                            cywCtx.shadowBlur = 0;
                        }

                        cywCtx.fillText(cywChar, s.x, cywY);
                    }
                    cywCtx.globalAlpha = 1;
                    cywCtx.shadowBlur = 0;

                    s.y += s.speed;
                    if (s.y > cywStreamH) {
                        s.y = -cywStreamH * 0.3;
                        s.text = cywLines[Math.floor(Math.random() * cywLines.length)];
                        s.chars = s.text.split("");
                        s.offset = Math.floor(Math.random() * s.chars.length);
                        s.speed = cywSpeed * (0.7 + Math.random() * 0.8);
                    }
                });

                cywAnimId = requestAnimationFrame(cyw_draw);
            }

            cywPauseBtn.addEventListener("click", function () {
                cywRunning = !cywRunning;
                cywPauseBtn.textContent = cywRunning ? "⏸ 暂停" : "▶ 继续";
                cywPauseBtn.className = "cyw-btn " + (cywRunning ? "cyw-pause" : "");
            });

            cywResetBtn.addEventListener("click", function () {
                cyw_resize();
                cywSpeed = parseFloat(cywSpeedSel.value);
                cywColor = cywColorSel.value;
            });

            cywSpeedSel.addEventListener("change", function () {
                cywSpeed = parseFloat(cywSpeedSel.value);
            });

            cywColorSel.addEventListener("change", function () {
                cywColor = cywColorSel.value;
            });

            cyw_resize();
            cyw_draw();
            window.addEventListener("resize", cyw_resize);
        })();
    </script>
</body>
</html>
