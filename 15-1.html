<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <!-- 姓名：崔溢文，日期：2026-10-26，功能名称：数7游戏 100格可视化 -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>15-1 数7</title>
    <style>
        body { font-family: "微软雅黑", sans-serif; max-width: 560px; margin: 40px auto; padding: 0 20px; text-align: center; }
        h2 { color: #4a90e2; }
        p.cyw-rule { color: #666; font-size: 14px; margin-bottom: 20px; }
        .cyw-grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; }
        .cyw-box { width: 46px; height: 46px; line-height: 46px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; text-align: center; background: #f9f9f9; }
        .cyw-box.cyw-pass { background: #4a90e2; color: #fff; border-color: #4a90e2; }
        .cyw-home { margin-top: 30px; display: inline-block; padding: 6px 18px; background: #4a90e2; color: #fff; text-decoration: none; border-radius: 4px; }
    </style>
</head>
<body>
    <h2>数7游戏 — 崔溢文</h2>
    <p class="cyw-rule">规则：遇到 7 的倍数、末尾含 7、或数字中含 7 的就"过"（蓝色空盒子）</p>
    <div id="cyw_grid" class="cyw-grid"></div>
    <a href="./1-1.html" class="cyw-home">首页</a>
    <script>
        var cyw_html = "";
        for (var cyw_i = 1; cyw_i <= 100; cyw_i++) {
            var cyw_str = cyw_i.toString();
            var cyw_skip = (cyw_i % 7 === 0) || (cyw_str.indexOf("7") !== -1);
            if (cyw_skip) {
                cyw_html += '<div class="cyw-box cyw-pass"></div>';
            } else {
                cyw_html += '<div class="cyw-box">' + cyw_i + '</div>';
            }
        }
        document.getElementById("cyw_grid").innerHTML = cyw_html;
    </script>
</body>
</html>
