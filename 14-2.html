<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <!-- 姓名：崔溢文，日期：2026-10-22，功能名称：JavaScript 六种基础数据类型演示 -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>14-2 数据类型</title>
    <style>
        body { font-family: "微软雅黑", sans-serif; max-width: 700px; margin: 40px auto; padding: 0 20px; }
        h2 { color: #333; border-left: 4px solid #4a90e2; padding-left: 10px; }
        .cyw-row { display: flex; border-bottom: 1px solid #eee; padding: 10px 0; }
        .cyw-label { width: 120px; font-weight: bold; color: #4a90e2; }
        .cyw-value { flex: 1; font-family: Consolas, monospace; color: #555; }
        .cyw-type { width: 100px; color: #999; font-style: italic; }
        .cyw-home { margin-top: 30px; display: inline-block; padding: 6px 18px; background: #4a90e2; color: #fff; text-decoration: none; border-radius: 4px; }
    </style>
</head>
<body>
    <h2>JavaScript 六种基础数据类型演示</h2>
    <div id="cyw_result"></div>
    <a href="./1-1.html" class="cyw-home">首页</a>
    <script>
        var cyw_out = "";

        var cyw_num = 123;
        var cyw_str = "你好 JavaScript";
        var cyw_bool = true;
        var cyw_undef;
        var cyw_null = null;
        var cyw_obj = { name: "崔溢文", age: 20 };

        cyw_out += '<div class="cyw-row"><div class="cyw-label">Number</div>'
                + '<div class="cyw-value">' + cyw_num + '</div>'
                + '<div class="cyw-type">' + typeof cyw_num + '</div></div>';

        cyw_out += '<div class="cyw-row"><div class="cyw-label">String</div>'
                + '<div class="cyw-value">' + cyw_str + '</div>'
                + '<div class="cyw-type">' + typeof cyw_str + '</div></div>';

        cyw_out += '<div class="cyw-row"><div class="cyw-label">Boolean</div>'
                + '<div class="cyw-value">' + cyw_bool + '</div>'
                + '<div class="cyw-type">' + typeof cyw_bool + '</div></div>';

        cyw_out += '<div class="cyw-row"><div class="cyw-label">Undefined</div>'
                + '<div class="cyw-value">' + cyw_undef + '</div>'
                + '<div class="cyw-type">' + typeof cyw_undef + '</div></div>';

        cyw_out += '<div class="cyw-row"><div class="cyw-label">Null</div>'
                + '<div class="cyw-value">' + cyw_null + ' (注意 typeof 返回 object)</div>'
                + '<div class="cyw-type">' + typeof cyw_null + '</div></div>';

        cyw_out += '<div class="cyw-row"><div class="cyw-label">Object</div>'
                + '<div class="cyw-value">' + JSON.stringify(cyw_obj) + '</div>'
                + '<div class="cyw-type">' + typeof cyw_obj + '</div></div>';

        document.getElementById("cyw_result").innerHTML = cyw_out;

        console.log("=== 六种数据类型 ===");
        console.log("Number:", cyw_num, typeof cyw_num);
        console.log("String:", cyw_str, typeof cyw_str);
        console.log("Boolean:", cyw_bool, typeof cyw_bool);
        console.log("Undefined:", cyw_undef, typeof cyw_undef);
        console.log("Null:", cyw_null, typeof cyw_null);
        console.log("Object:", cyw_obj, typeof cyw_obj);
    </script>
</body>
</html>
