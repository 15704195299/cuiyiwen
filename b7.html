<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>长安的荔枝</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "STKaiti", "KaiTi", "Kaiti SC", "楷体", "Microsoft YaHei", serif;
      background: linear-gradient(180deg, #f7f1e6 0%, #eedfc7 100%);
      color: #2f241d;
    }
    a { text-decoration: none; color: inherit; }
    img { display: block; max-width: 100%; }
    .page { width: min(1100px, calc(100% - 24px)); margin: 50px auto; }
    .back { display: inline-block; margin-bottom: 22px; padding: 10px 18px; border-radius: 999px; background: rgba(255,255,255,0.5); border: 1px solid rgba(91, 67, 53, 0.15); color: #563f35; font-size: 1rem; }
    .panel { display: grid; grid-template-columns: 360px 1fr; gap: 30px; background: rgba(255,255,255,0.35); border: 1px solid rgba(101, 74, 62, 0.12); border-radius: 28px; padding: 28px; box-shadow: 0 16px 36px rgba(104, 78, 61, 0.08); }
    .cover { background: #f7f0e7; border-radius: 22px; padding: 18px; border: 1px solid rgba(103, 79, 65, 0.08); }
    .cover img { width: 100%; height: 500px; object-fit: contain; border-radius: 14px; }
    .info { display: flex; flex-direction: column; justify-content: center; }
    .tag { display: inline-block; width: fit-content; padding: 8px 14px; border-radius: 999px; background: rgba(181, 126, 94, 0.12); border: 1px solid rgba(101, 74, 62, 0.12); color: #714d3d; font-size: 0.9rem; letter-spacing: 2px; }
    h1 { font-size: clamp(2.1rem, 4vw, 3.3rem); margin: 18px 0 10px; }
    .meta { color: #695b54; font-size: 1.05rem; margin: 0 0 14px; }
    .summary { font-size: 1.12rem; line-height: 2; color: #4b3d38; margin: 0 0 20px; }
    .quote { background: rgba(255,255,255,0.35); border-left: 4px solid #c58c61; padding: 16px 18px; margin: 18px 0; border-radius: 12px; color: #5d453e; font-size: 1.05rem; line-height: 1.9; }
    .chips { display: flex; flex-wrap: wrap; gap: 12px; list-style: none; padding: 0; margin: 0; }
    .chips li { padding: 8px 14px; border-radius: 999px; background: rgba(255,255,255,0.4); border: 1px solid rgba(103, 79, 65, 0.12); color: #563f35; }
    @media (max-width:760px) { .panel { grid-template-columns: 1fr; } .cover img { height: auto; max-height: 420px; } }
  </style>
</head>
<body>
  <div class="page">
    <a class="back" href="./index.html">← 返回推荐</a>
    <div class="panel">
      <div class="cover"><img src="./img/b7.jpg" alt="长安的荔枝" /></div>
      <div class="info">
        <span class="tag">书籍介绍</span>
        <h1>《长安的荔枝》</h1>
        <p class="meta">作者：马伯庸 ｜ 历史 · 现实 ｜ 权谋与人情</p>
        <p class="summary">这是一部兼具戏剧张力与历史感的小说，讲述了一个看似普通的运输任务如何牵动整座长安城。它在讲故事的同时，也写出官场、制度与人性的复杂。</p>
        <div class="quote">“真正的难事，不是做成一件事，而是让一切不至于失控。”</div>
        <ul class="chips">
          <li>适合：喜欢历史小说与快节奏叙事的人</li>
          <li>阅读长度：约4小时</li>
          <li>推荐理由：好看、好读、带历史味道</li>
        </ul>
      </div>
    </div>
  </div>
</body>
</html>
