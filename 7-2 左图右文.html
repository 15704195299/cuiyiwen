 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #f5f5f5;
            font-family: "Microsoft YaHei", sans-serif;
        }

        .list {
            width: 1200px;
            margin: 50px auto;
            list-style: none;
        }

        .list li {
            display: flex;
            align-items: center;
            margin-bottom: 30px;
            background: #fff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .list img {
            width: 260px;
            height: 180px;
            object-fit: cover;
            display: block;
        }

        .list .text {
            flex: 1;
            padding: 0 30px;
        }

        .list h3 {
            font-size: 24px;
            margin-bottom: 12px;
            color: #333;
        }

        .list p {
            font-size: 16px;
            line-height: 1.8;
            color: #666;
        }
    </style>
</head>
<body>
    <ul class="list">
        <li>
            <img src="./img/1.jpg" alt="">
            <div class="text">
                <h3>崔溢文的标题1</h3>
                <p>这是第一段说明文字，描述图片内容和相关信息。通常用于展示模块介绍、产品特点或文章摘要。</p>
            </div>
        </li>
        <li>
            <img src="./img/2.jpg" alt="">
            <div class="text">
                <h3>崔溢文的标题2</h3>
                <p>这是第二段说明文字，内容相对简洁，重点突出展示内容和结构。适合在网页中做信息列表布局。</p>
            </div>
        </li>
        <li>
            <img src="./img/3.jpg" alt="">
            <div class="text">
                <h3>崔溢文的标题3</h3>
                <p>这是第三段说明文字，配合三张图片形成统一的左右文字布局，让页面视觉更协调，信息更清晰。</p>
            </div>
        </li>
    </ul>
</body>
</html>
