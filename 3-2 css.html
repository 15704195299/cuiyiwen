 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>122崔溢文</title>
    <style>
        h3 {
            color: rgb(227, 66, 66);
        }
        p {
            color: rgb(89, 194, 19);
        }
        /*id选择器*/
        #box {
            width: 500px;
            height: 300px;
            background-color: rgb(255, 237, 254);
        }
        /*三个字分别设置颜色，span默认同一行*/
        .zi1{
            color:#1e1a96;
        }
        .zi2{
            color:#c8d444;
        }
        .zi3{
            color:#e63acf;
        }
        /*扩展1：h2黑底白字*/
        h2{
            background-color: black;
            color: white;
        }
        /*扩展3：选择器三个字白色*/
        .white-text{
            color:white;
        }
        /*扩展4：学号盒子，宽高背景*/
        #stu-box{
            width: 400px;
            height: 150px;
            background-color: #87ceeb;
        }
    </style>
</head>
<body>
    <h2>层叠样式表css</h2>
    <div id="box">
        <h3>CSS选择器</h3>
        <!-- span是行内元素，默认在同一行显示 -->
        <!-- 扩展3：选择器三个字白色 -->
        <p><span class="white-text">选</span><span class="white-text">择</span><span class="white-text">器</span></p>
        <!-- 扩展2：名字每个字不同颜色同一行 -->
        <p><span class="zi1">崔</span><span class="zi2">溢</span><span class="zi3">文</span></p>
        <p>CSS属性</p>
    </div>
    <!--扩展4：新加盒子，放学号，有宽高背景 -->
    <div id="stu-box">
        <p>学号：24001010122</p>
    </div>
</body>
</html>
