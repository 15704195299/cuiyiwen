 <!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 姓名：崔溢文，日期：2026-11-05，功能名称：Three.js 两个 3D 图表（粒子云 + 柱状图） -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>18-7 Three.js 3D 图表 - 崔溢文</title>
    <script src="./cdn/three.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #0a0e1a;
            min-height: 100vh;
            color: #eee;
            padding: 30px 20px;
        }
        h1 {
            text-align: center;
            font-size: 28px;
            margin-bottom: 6px;
            background: linear-gradient(90deg, #00d4ff, #a78bfa, #f472b6);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .cyw_subtitle {
            text-align: center;
            color: #aaa;
            margin-bottom: 28px;
            font-size: 14px;
        }
        .cyw_grid {
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(560px, 1fr));
            gap: 24px;
        }
        .cyw_card {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(0,212,255,0.15);
            border-radius: 14px;
            padding: 18px;
            display: flex;
            flex-direction: column;
        }
        .cyw_card h2 {
            font-size: 16px;
            color: #00d4ff;
            margin-bottom: 4px;
        }
        .cyw_card p.cyw_desc {
            font-size: 12px;
            color: #777;
            margin-bottom: 12px;
        }
        .cyw_canvas {
            width: 100%;
            height: 460px;
            position: relative;
            border-radius: 8px;
            overflow: hidden;
            cursor: grab;
        }
        .cyw_canvas canvas { display: block; width: 100% !important; height: 100% !important; }
        .cyw_canvas:active { cursor: grabbing; }
        .cyw_legend {
            display: flex;
            flex-wrap: wrap;
            gap: 10px 16px;
            padding: 10px 4px 0;
            font-size: 12px;
            color: #aaa;
        }
        .cyw_legend span {
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .cyw_legend i {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 2px;
        }
    </style>
</head>
<body>
    <h1>🌐 Three.js 3D 可视化图表</h1>
    <p class="cyw_subtitle">three.js r149 · 本地 CDN · 原生实现 · 姓名：崔溢文 · 18-7</p>

    <div class="cyw_grid">
        <div class="cyw_card">
            <h2>💠 3D 散点粒子云（N 体动态）</h2>
            <p class="cyw_desc">1200 粒子 + 近邻连线 + 鼠标拖拽旋转，模拟 NPM 依赖关系图</p>
            <div class="cyw_canvas" id="cyw_canvas1"></div>
            <div class="cyw_legend">
                <span><i style="background:#ff6b6b"></i>红色：核心节点</span>
                <span><i style="background:#00d4ff"></i>青色：普通节点</span>
                <span><i style="background:#a78bfa"></i>紫色：边缘节点</span>
            </div>
        </div>

        <div class="cyw_card">
            <h2>📊 3D 柱状图（季度销售矩阵）</h2>
            <p class="cyw_desc">6 产品线 × 4 季度数据，高度映射 Y 轴，颜色按季度区分</p>
            <div class="cyw_canvas" id="cyw_canvas2"></div>
            <div class="cyw_legend">
                <span><i style="background:#ff6b6b"></i>Q1</span>
                <span><i style="background:#ffa94d"></i>Q2</span>
                <span><i style="background:#51cf66"></i>Q3</span>
                <span><i style="background:#4dabf7"></i>Q4</span>
            </div>
        </div>
    </div>

    <script>
    (function () {
        function cyw_makeOrbit(cyw_el) {
            var state = {
                rotX: -0.35, rotY: 0.5, dist: 4,
                dragging: false, lastX: 0, lastY: 0,
                targetRotX: -0.35, targetRotY: 0.5,
                enable: true
            };
            cyw_el.addEventListener('mousedown', function (e) {
                if (!state.enable) return;
                state.dragging = true; state.lastX = e.clientX; state.lastY = e.clientY;
            });
            window.addEventListener('mousemove', function (e) {
                if (!state.dragging) return;
                var dx = e.clientX - state.lastX, dy = e.clientY - state.lastY;
                state.targetRotY += dx * 0.005;
                state.targetRotX += dy * 0.005;
                state.targetRotX = Math.max(-Math.PI/2+0.2, Math.min(Math.PI/2-0.2, state.targetRotX));
                state.lastX = e.clientX; state.lastY = e.clientY;
            });
            window.addEventListener('mouseup', function () { state.dragging = false; });
            cyw_el.addEventListener('wheel', function (e) {
                e.preventDefault();
                state.dist *= (1 + e.deltaY * 0.001);
                state.dist = Math.max(2, Math.min(10, state.dist));
            }, { passive: false });
            return state;
        }
        function cyw_applyOrbit(state, cyw_camera, cyw_auto) {
            if (!state.dragging && cyw_auto) state.targetRotY += 0.003;
            state.rotX += (state.targetRotX - state.rotX) * 0.08;
            state.rotY += (state.targetRotY - state.rotY) * 0.08;
            cyw_camera.position.x = state.dist * Math.cos(state.rotX) * Math.sin(state.rotY);
            cyw_camera.position.y = state.dist * Math.sin(state.rotX);
            cyw_camera.position.z = state.dist * Math.cos(state.rotX) * Math.cos(state.rotY);
            cyw_camera.lookAt(0, 0, 0);
        }

        // ===== 图 1：3D 粒子云 =====
        (function cyw_particles() {
            var cyw_el = document.getElementById('cyw_canvas1');
            var cyw_w = cyw_el.clientWidth, cyw_h = cyw_el.clientHeight;
            var cyw_scene = new THREE.Scene();
            cyw_scene.background = new THREE.Color(0x0a0e1a);
            var cyw_camera = new THREE.PerspectiveCamera(50, cyw_w / cyw_h, 0.01, 100);
            cyw_camera.position.set(0, 0, 4);
            var cyw_renderer = new THREE.WebGLRenderer({ antialias: true });
            cyw_renderer.setPixelRatio(window.devicePixelRatio);
            cyw_renderer.setSize(cyw_w, cyw_h);
            cyw_el.appendChild(cyw_renderer.domElement);

            var cyw_N = 1200;
            var cyw_positions = new Float32Array(cyw_N * 3);
            var cyw_colors = new Float32Array(cyw_N * 3);
            var cyw_coreSet = {};
            for (var i = 0; i < 18; i++) cyw_coreSet[i] = true;

            function cyw_frand(a, b) { return a + Math.random() * (b - a); }
            for (var i = 0; i < cyw_N; i++) {
                var r = cyw_frand(0.5, 2.2);
                var theta = cyw_frand(0, Math.PI * 2);
                var phi = cyw_frand(-Math.PI / 3, Math.PI / 3);
                cyw_positions[i*3]   = r * Math.cos(phi) * Math.cos(theta);
                cyw_positions[i*3+1] = r * Math.sin(phi);
                cyw_positions[i*3+2] = r * Math.cos(phi) * Math.sin(theta);
                if (cyw_coreSet[i]) {
                    cyw_colors[i*3]   = 1.0; cyw_colors[i*3+1] = 0.42; cyw_colors[i*3+2] = 0.42;
                } else if (r < 1.2) {
                    cyw_colors[i*3]   = 0.0; cyw_colors[i*3+1] = 0.83; cyw_colors[i*3+2] = 1.0;
                } else {
                    cyw_colors[i*3]   = 0.65; cyw_colors[i*3+1] = 0.55; cyw_colors[i*3+2] = 0.98;
                }
            }
            var cyw_pGeo = new THREE.BufferGeometry();
            cyw_pGeo.setAttribute('position', new THREE.BufferAttribute(cyw_positions, 3));
            cyw_pGeo.setAttribute('color', new THREE.BufferAttribute(cyw_colors, 3));
            var cyw_pMat = new THREE.PointsMaterial({
                size: 0.04, vertexColors: true, transparent: true, opacity: 0.9,
                depthWrite: false, blending: THREE.AdditiveBlending
            });
            var cyw_points = new THREE.Points(cyw_pGeo, cyw_pMat);
            cyw_scene.add(cyw_points);

            var cyw_MAX_LINES = 2400;
            var cyw_linePos = new Float32Array(cyw_MAX_LINES * 6);
            var cyw_lineCol = new Float32Array(cyw_MAX_LINES * 6);
            var cyw_lineGeo = new THREE.BufferGeometry();
            cyw_lineGeo.setAttribute('position', new THREE.BufferAttribute(cyw_linePos, 3));
            cyw_lineGeo.setAttribute('color', new THREE.BufferAttribute(cyw_lineCol, 3));
            var cyw_lineMat = new THREE.LineBasicMaterial({
                vertexColors: true, transparent: true, opacity: 0.18,
                depthWrite: false, blending: THREE.AdditiveBlending
            });
            var cyw_lineMesh = new THREE.LineSegments(cyw_lineGeo, cyw_lineMat);
            cyw_scene.add(cyw_lineMesh);

            var cyw_orb = cyw_makeOrbit(cyw_el);
            function cyw_drawLines() {
                var cyw_idx = 0;
                for (var a = 0; a < cyw_N && cyw_idx < cyw_MAX_LINES * 2; a++) {
                    var ax = cyw_positions[a*3], ay = cyw_positions[a*3+1], az = cyw_positions[a*3+2];
                    for (var b = a + 1; b < cyw_N && cyw_idx < cyw_MAX_LINES * 2; b++) {
                        var dx = ax - cyw_positions[b*3], dy = ay - cyw_positions[b*3+1], dz = az - cyw_positions[b*3+2];
                        var d2 = dx*dx + dy*dy + dz*dz;
                        if (d2 < 0.12) {
                            cyw_linePos[cyw_idx*3]   = ax;
                            cyw_linePos[cyw_idx*3+1] = ay;
                            cyw_linePos[cyw_idx*3+2] = az;
                            cyw_linePos[cyw_idx*3+3] = cyw_positions[b*3];
                            cyw_linePos[cyw_idx*3+4] = cyw_positions[b*3+1];
                            cyw_linePos[cyw_idx*3+5] = cyw_positions[b*3+2];
                            cyw_lineCol[cyw_idx*3]   = cyw_colors[a*3];
                            cyw_lineCol[cyw_idx*3+1] = cyw_colors[a*3+1];
                            cyw_lineCol[cyw_idx*3+2] = cyw_colors[a*3+2];
                            cyw_lineCol[cyw_idx*3+3] = cyw_colors[b*3];
                            cyw_lineCol[cyw_idx*3+4] = cyw_colors[b*3+1];
                            cyw_lineCol[cyw_idx*3+5] = cyw_colors[b*3+2];
                            cyw_idx++;
                        }
                    }
                }
                cyw_lineGeo.setDrawRange(0, cyw_idx * 2);
                cyw_lineGeo.attributes.position.needsUpdate = true;
                cyw_lineGeo.attributes.color.needsUpdate = true;
            }
            cyw_drawLines();

            var cyw_clock = new THREE.Clock();
            function cyw_animate1() {
                requestAnimationFrame(cyw_animate1);
                var t = cyw_clock.getElapsedTime();
                cyw_points.rotation.y = t * 0.08;
                cyw_points.rotation.x = Math.sin(t * 0.3) * 0.1;
                cyw_lineMesh.rotation.copy(cyw_points.rotation);
                cyw_applyOrbit(cyw_orb, cyw_camera, true);
                cyw_renderer.render(cyw_scene, cyw_camera);
            }
            cyw_animate1();
            window.addEventListener('resize', function () {
                cyw_w = cyw_el.clientWidth; cyw_h = cyw_el.clientHeight;
                cyw_camera.aspect = cyw_w / cyw_h; cyw_camera.updateProjectionMatrix();
                cyw_renderer.setSize(cyw_w, cyw_h);
            });
        })();

        // ===== 图 2：3D 柱状图 =====
        (function cyw_bars() {
            var cyw_el = document.getElementById('cyw_canvas2');
            var cyw_w = cyw_el.clientWidth, cyw_h = cyw_el.clientHeight;
            var cyw_scene = new THREE.Scene();
            cyw_scene.background = new THREE.Color(0x0a0e1a);
            var cyw_camera = new THREE.PerspectiveCamera(50, cyw_w / cyw_h, 0.01, 200);
            cyw_camera.position.set(8, 8, 12);
            var cyw_renderer = new THREE.WebGLRenderer({ antialias: true });
            cyw_renderer.setPixelRatio(window.devicePixelRatio);
            cyw_renderer.setSize(cyw_w, cyw_h);
            cyw_renderer.shadowMap.enabled = true;
            cyw_el.appendChild(cyw_renderer.domElement);

            cyw_scene.add(new THREE.AmbientLight(0xffffff, 0.5));
            var cyw_dir = new THREE.DirectionalLight(0xffffff, 0.9);
            cyw_dir.position.set(10, 15, 10);
            cyw_dir.castShadow = true;
            cyw_scene.add(cyw_dir);
            var cyw_fill = new THREE.DirectionalLight(0x00d4ff, 0.3);
            cyw_fill.position.set(-10, 5, -5);
            cyw_scene.add(cyw_fill);

            var cyw_floors = new THREE.Mesh(
                new THREE.PlaneGeometry(12, 10),
                new THREE.MeshStandardMaterial({ color: 0x1a2332, roughness: 0.8, metalness: 0.2 })
            );
            cyw_floors.rotation.x = -Math.PI / 2;
            cyw_floors.position.y = 0;
            cyw_floors.receiveShadow = true;
            cyw_scene.add(cyw_floors);

            var cyw_COLORS = [0xff6b6b, 0xffa94d, 0x51cf66, 0x4dabf7];
            var cyw_GRID_W = 6, cyw_GRID_H = 4;
            var cyw_SPACING = 1.6;
            var cyw_group = new THREE.Group();
            cyw_scene.add(cyw_group);

            var cyw_data = [
                [12, 18, 22, 16, 28, 32],
                [8, 24, 30, 20, 35, 40],
                [15, 20, 26, 28, 33, 38],
                [10, 22, 28, 24, 36, 42]
            ];

            for (var q = 0; q < cyw_GRID_H; q++) {
                for (var p = 0; p < cyw_GRID_W; p++) {
                    var cyw_h = cyw_data[q][p] / 10;
                    var cyw_geo = new THREE.BoxGeometry(0.9, cyw_h, 0.9);
                    var cyw_mat = new THREE.MeshStandardMaterial({
                        color: cyw_COLORS[q], roughness: 0.4, metalness: 0.1,
                        emissive: new THREE.Color(cyw_COLORS[q]), emissiveIntensity: 0.08
                    });
                    var cyw_mesh = new THREE.Mesh(cyw_geo, cyw_mat);
                    cyw_mesh.position.set(
                        (p - (cyw_GRID_W - 1) / 2) * cyw_SPACING,
                        cyw_h / 2,
                        (q - (cyw_GRID_H - 1) / 2) * cyw_SPACING
                    );
                    cyw_mesh.castShadow = true;
                    cyw_mesh.receiveShadow = true;
                    cyw_group.add(cyw_mesh);
                }
            }

            var cyw_axes = new THREE.Group();
            function cyw_axis(from, to, color) {
                var g = new THREE.BufferGeometry().setFromPoints([from, to]);
                cyw_axes.add(new THREE.Line(g, new THREE.LineBasicMaterial({ color: color })));
            }
            cyw_axis(new THREE.Vector3(-5.5, 0, -3.5), new THREE.Vector3(5.5, 0, -3.5), 0x555555);
            cyw_axis(new THREE.Vector3(-5.5, 0, -3.5), new THREE.Vector3(-5.5, 0, 3.5), 0x555555);
            cyw_axis(new THREE.Vector3(-5.5, 0, -3.5), new THREE.Vector3(-5.5, 5, -3.5), 0x333333);
            cyw_scene.add(cyw_axes);

            var cyw_orb = cyw_makeOrbit(cyw_el);
            function cyw_animate2() {
                requestAnimationFrame(cyw_animate2);
                cyw_applyOrbit(cyw_orb, cyw_camera, true);
                cyw_renderer.render(cyw_scene, cyw_camera);
            }
            cyw_animate2();
            window.addEventListener('resize', function () {
                cyw_w = cyw_el.clientWidth; cyw_h = cyw_el.clientHeight;
                cyw_camera.aspect = cyw_w / cyw_h; cyw_camera.updateProjectionMatrix();
                cyw_renderer.setSize(cyw_w, cyw_h);
            });
        })();
    })();
    </script>

    <footer style="text-align:center;margin:30px 0 0;padding-top:20px;border-top:1px solid rgba(0,212,255,0.15)">

    </footer>
</body>
